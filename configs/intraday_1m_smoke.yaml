# Smoke test for 1-minute intraday harness using yfinance. yfinance returns
# at most ~7 days of 1m bars per request and ~30 days of history total — pick
# a recent window when you actually run this.
#
# 1-minute bars × 6.5h × 252 sessions = 98280 bars/year for annualisation.

data:
  source: yfinance_intraday
  interval: "1m"
  start: "2026-05-18"
  end: "2026-05-23"
  tickers: [AAPL, MSFT, GOOGL, AMZN, NVDA, META, JPM, V, JNJ, WMT]
  cache_dir: ./data_cache
  covariates:
    lags: [1, 5, 60]
    vol_window: 60
    mom_long: 390
    mom_short: 60
    log_vol_z_window: 390

models: [zero, mean, ridge, lightgbm]

horizon: 1
oos_start: "2026-05-22 09:30"
oos_end:   "2026-05-22 16:00"
bars_per_year: 98280
output_dir: ./results/intraday_1m_smoke
